name: Build APK

on:
  push:
    branches: [ main, 'fix/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Resolve Android SDK
        run: |
          for p in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk "$HOME/android-sdk"; do
            if [ -n "$p" ] && [ -d "$p" ]; then
              echo "Using SDK at: $p"
              echo "ANDROID_HOME=$p" >> $GITHUB_ENV
              echo "ANDROID_SDK_ROOT=$p" >> $GITHUB_ENV
              break
            fi
          done
          echo "platforms available:"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Run offline Java regressions
        run: |
          mkdir -p /tmp/pos-tests
          javac -encoding UTF-8 -d /tmp/pos-tests app/src/main/java/com/dragonoro/pos/OrderSchedule.java app/src/main/java/com/dragonoro/pos/PrintJournal.java app/src/test/java/com/dragonoro/pos/QueueRegression.java
          java -cp /tmp/pos-tests com.dragonoro.pos.QueueRegression

      - name: Restore testing signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pos-debug-signing-v1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ChinaIdealPOS-v1.9.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/ChinaIdealPOS-v1.9.apk
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: China Ideal POS ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/ChinaIdealPOS-v1.9.apk

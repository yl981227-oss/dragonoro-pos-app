name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Resolve Android SDK
        run: |
          for p in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk "$HOME/android-sdk"; do
            if [ -n "$p" ] && [ -d "$p" ]; then
              echo "Using SDK at: $p"
              echo "ANDROID_HOME=$p" >> $GITHUB_ENV
              echo "ANDROID_SDK_ROOT=$p" >> $GITHUB_ENV
              break
            fi
          done
          echo "platforms available:"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
